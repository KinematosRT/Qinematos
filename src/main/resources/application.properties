# Qinematos Data Base Plane - Configuration
quarkus.application.name=qinematos
quarkus.application.version=1.0.0-SNAPSHOT

# HTTP Configuration
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=*

# gRPC Configuration
quarkus.grpc.server.port=9000
quarkus.grpc.server.use-separate-server=true

# Qinematos IPC Configuration
qinematos.ipc.base-path=/dev/shm/qinematos
qinematos.ipc.max-segment-size=1073741824
qinematos.ipc.enable-lineage=true

# Qinematos Xodus Persistence
qinematos.xodus.data-dir=./data/xodus
qinematos.xodus.memory-usage-percentage=50

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.qinematos".level=DEBUG
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# Swagger/OpenAPI
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Qinematos Data Base Plane API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Deterministic Data Base Plane for Agentic AI - RVP Framework

# Native image
quarkus.native.additional-build-args=--enable-preview
